[project]
name = "rupert-pet"
version = "1.0.0"
description = "A pixel pet that naps on your active window and answers quick questions in as few words as possible."
readme = "../README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.4",
    "python-xlib; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["F", "E", "W", "B", "I", "UP", "SIM"]
ignore = [
    "E741",
    "SIM108",
]

[tool.ruff.lint.isort]
known-first-party = ["rupert"]

[tool.pytest.ini_options]
testpaths = ["tests"]
